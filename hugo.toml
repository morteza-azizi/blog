baseURL = "https://www.mortezaazizi.com/"
languageCode = 'en-us'
title = 'Morteza Azizi'
theme = 'hugo-coder'
enableGitInfo = true
ignoreLogs = ['warning-goldmark-raw-html']

[taxonomies]
    tag = "tags"
    category = "categories"
    series = "series"

[params]
    # Theme options
    defaultTheme = "auto"
    ShowBreadCrumbs = true
    ShowToc = true
    mainSections = ["posts"]
    customCSS = ["css/series.css", "css/posts.css", "css/home.css"]
    
    # Profile information
    author = "Morteza Azizi"
    role = "Software Architect"
    info = "Designing and building scalable systems."
    description = "Software architecture writing by Morteza Azizi: Azure, .NET, distributed systems, RAG, and Microsoft Foundry, from systems that were actually built."
    images = ["/img/avatar.jpg"]
    avatarURL = "/img/avatar.jpg"
    
    # Social links
    [[params.social]]
        name = "GitHub"
        url = "https://github.com/morteza-azizi"
        icon = "fa-brands fa-github"
        weight = 1
    [[params.social]]
        name = "LinkedIn"
        url = "https://www.linkedin.com/in/morteza-azizi-6b974a39/"
        icon = "fa-brands fa-linkedin"
        weight = 2
    [[params.social]]
        name = "X"
        url = "https://x.com/MortezaAzizi"
        icon = "fa-brands fa-x-twitter"
        weight = 3

[social]
    twitter = "MortezaAzizi"

[outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
    home = ["HTML", "RSS", "llms"]

[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 1

    [[menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts/"
        weight = 2
        
    [[menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 3
